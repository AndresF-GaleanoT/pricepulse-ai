services:
  api:
    build: .
    container_name: precios-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - cache_data:/app/cache
    networks:
      - precios-network

  db:
    image: postgres:16-alpine
    container_name: precios-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pricepulse}
      POSTGRES_USER: ${POSTGRES_USER:-precios}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-precios2024}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U precios -d pricepulse"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - precios-network

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: precios-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    env_file:
      - .env
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD:-cambiar-password}
      - N8N_HOST=0.0.0.0
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://localhost:5678}
    volumes:
      - n8n_data:/home/node/.n8n
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:5678/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      - api
    networks:
      - precios-network

volumes:
  pgdata:
  n8n_data:
  cache_data:

networks:
  precios-network:
    driver: bridge
